services:
  db:
    image: postgis/postgis:14-3.3
    container_name: postgis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: uberdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - backend

  app:
    build: .
    container_name: uber_backend_app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DATABASE_GMAIL: your_email@gmail.com
      DATABASE_GMAIL_PASSWORD: your_gmail_app_password
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:

